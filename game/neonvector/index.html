<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON VECTOR 2077 // Cyberspace Shmup</title>
<meta name="description" content="Cyberpunk vertical bullet-hell shooter: graze, overdrive, megacorp bosses.">
<link rel="icon" href="/portfolio/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/cyber-theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="hud">
  <a class="hub" id="hubLink" href="../">◢ CYBER HUB</a>
  <div class="stats">
    <div class="stat"><span data-i="hull">HULL</span><b id="sHull">♦♦♦</b></div>
    <div class="stat"><span data-i="sector">SECTOR</span><b id="sSector">1</b></div>
    <div class="stat"><span data-i="mult">MULT</span><b id="sMult">1.0×</b></div>
    <div class="stat wide"><span data-i="overdrive">OVERDRIVE</span><b id="sOd">25%</b><i class="bar"><u id="odBar"></u></i></div>
    <div class="stat"><span data-i="eddies">EDDIES</span><b id="sEddies">€$0</b></div>
    <div class="stat"><span data-i="score">SCORE</span><b id="sScore">0</b></div>
  </div>
  <div class="btns">
    <button id="bBomb" data-i="bomb" title="Space / Shift / Right-click">OVERDRIVE PULSE</button>
    <button id="bAuto" data-i="auto">AUTO-FIRE</button>
    <button id="bPause" data-i="pause">PAUSE</button>
    <button id="bMute" data-i="mute">MUTE</button>
    <button id="bLang">עב</button>
  </div>
</header>
<main id="stage"><canvas id="cv"></canvas>
  <div id="banner" hidden></div>
  <section id="overlay" class="overlay">
    <h1>NEON VECTOR 2077</h1>
    <h2 data-i="subtitle">CYBERSPACE SHMUP</h2>
    <p id="help" data-i="help"></p>
    <div id="result" hidden></div>
    <div class="row">
      <button id="bResumeSaved" class="big cyan" hidden></button>
      <button id="bStart" class="big" data-i="start">JACK IN</button>
      <button id="bEndless" class="big alt" data-i="endless" hidden>ENDLESS OVERCLOCK</button>
      <a id="bOverlayHub" class="big hub-btn" href="../" data-i="hub">◢ CYBER HUB</a>
    </div>
  </section>
  <section id="pauseOverlay" class="overlay pause-overlay" hidden>
    <h1 data-i="paused">PAUSED</h1>
    <p id="pauseInfo" class="pause-info"></p>
    <div class="row">
      <button id="bResume" class="big cyan" data-i="resume">RESUME</button>
      <button id="bRestart" class="big" data-i="restart">NEW RUN</button>
      <a id="bPauseHub" class="big hub-btn" href="../" data-i="hub">◢ CYBER HUB</a>
    </div>
  </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
