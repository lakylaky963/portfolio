<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>OVERCLOCK // ICE Shatter</title>
  <meta name="description" content="Cyberpunk 2077 brick-breaker siege: Capacitors, Twin Lasers, Sandevistan slow-mo, rotating ICE Core bosses.">
  <link rel="icon" href="/portfolio/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/cyber-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header id="hud" class="hud">
    <a id="hubLink" class="hub-link cyber-clip-sm" href="../" data-i="hub">◢ CYBER HUB</a>

    <div class="hud-stats" role="status" aria-live="off">
      <div class="stat">
        <span class="lbl" data-i="stage">STAGE</span>
        <b id="sStage" class="val">1/10</b>
      </div>
      <div class="stat">
        <span class="lbl" data-i="lives">LIVES</span>
        <b id="sLives" class="val lives">♦♦♦</b>
      </div>
      <div class="stat">
        <span class="lbl" data-i="combo">COMBO</span>
        <b id="sCombo" class="val cyan">1.0×</b>
      </div>
      <div class="stat">
        <span class="lbl" data-i="eddies">EDDIES</span>
        <b id="sEddies" class="val yellow">€$ 0</b>
      </div>
      <div class="stat">
        <span class="lbl" data-i="score">SCORE</span>
        <b id="sScore" class="val">0</b>
      </div>
    </div>

    <div class="hud-actions">
      <button id="bSande" class="hud-btn sande cyber-clip-sm" type="button" title="Q / Shift">
        <span class="sande-label" data-i="sandevistan">SANDEVISTAN [Q]</span>
        <span class="sande-bar"><i id="sandeFill"></i></span>
      </button>
      <button id="bPause" class="hud-btn cyber-clip-sm" type="button" data-i="pause" title="P / Esc">PAUSE</button>
      <button id="bMute" class="hud-btn cyber-clip-sm" type="button" data-i="mute" title="M">MUTE</button>
      <button id="bLang" class="hud-btn lang cyber-clip-sm" type="button">עב</button>
    </div>
  </header>

  <main id="stageWrap" class="stage-wrap">
    <div class="cabinet-frame cyber-clip" dir="ltr">
      <canvas id="cv" width="960" height="640" aria-label="OVERCLOCK ICE Shatter game field"></canvas>
      <div id="activePills" class="active-pills" aria-live="polite"></div>
    </div>

    <section id="overlay" class="overlay" aria-modal="true" role="dialog">
      <div class="panel cyber-clip">
        <div class="panel-tag" id="ovSub" data-i="subtitle">CYBER BREAKER 2077</div>
        <h1 class="panel-title" id="ovTitle" data-i="title">OVERCLOCK // ICE SHATTER</h1>

        <p id="autoPauseNote" class="autopause-note" hidden data-i="autoPausedNote">
          AUTO-PAUSED ON TAB SWITCH // PROGRESS SAVED
        </p>

        <div id="startInfo" class="start-info">
          <p class="help-line" data-i="helpControls"></p>
          <p class="help-tip" data-i="helpTip"></p>
          <ul class="pu-legend" aria-label="Power-ups">
            <li><kbd class="pu-k multi">[M]</kbd><span data-i="puMulti">MULTI-BALL</span></li>
            <li><kbd class="pu-k wide">[W]</kbd><span data-i="puWide">WIDE DECK</span></li>
            <li><kbd class="pu-k laser">[L]</kbd><span data-i="puLaser">TWIN LASERS</span></li>
            <li><kbd class="pu-k pierce">[P]</kbd><span data-i="puPierce">PLASMA PIERCE</span></li>
            <li><kbd class="pu-k shield">[G]</kbd><span data-i="puShield">MAG-SHIELD</span></li>
            <li><kbd class="pu-k eddy">[€]</kbd><span data-i="puEddy">EDDY SURGE</span></li>
          </ul>
        </div>

        <div id="resultBox" class="result-box" hidden></div>

        <div class="panel-actions">
          <button id="bResumeSaved" class="cyber-btn resume-saved" type="button" hidden>
            <span data-i="resumeSaved">▶ RESUME SAVED RUN</span>
            <small id="savedMeta"></small>
          </button>
          <button id="bPrimary" class="cyber-btn primary" type="button" data-i="start">JACK IN</button>
          <button id="bEndless" class="cyber-btn ghost alt-cyan" type="button" hidden data-i="endless">ENDLESS OVERCLOCK</button>
          <button id="bRestart" class="cyber-btn ghost" type="button" hidden data-i="restart">REBOOT RUN</button>
          <a id="bSaveExit" class="cyber-btn ghost alt-muted" href="../" hidden data-i="saveExit">SAVE & EXIT TO HUB</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
